<div class="loading-container" [class.loading-visible]="isLoading">
  <div class="loading-content">
    <mat-spinner
      [diameter]="size"
      [strokeWidth]="strokeWidth"
      [color]="color"
      *ngIf="isLoading"
    >
    </mat-spinner>

    <p class="loading-message" *ngIf="isLoading && showMessage">
      {{ getDefaultMessage() | translate }}
    </p>
  </div>
</div>
