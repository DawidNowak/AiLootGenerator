<div class="loot-generator">
  <!-- Responsive Container with CSS Grid -->
  <div
    class="responsive-container"
    [class.layout-stacked]="isMobile()"
    [class.layout-side-by-side]="isDesktop()"
  >
    <!-- Generation Form Section -->
    <section class="generation-section grid-form">
      <app-loot-form
        (lootGenerated)="onLootGenerated($event)"
        (generationError)="onLootGenerationError($event)"
        (priceToggleChanged)="onPriceToggleChange($event)"
        class="loot-form"
      >
      </app-loot-form>
    </section>

    <!-- Generated Loot Results Section -->
    <section
      class="results-section grid-results"
      *ngIf="generatedLoot().length > 0"
    >
      <div class="section-header">
        <h3 class="section-title">
          {{ "loot.generated.title" | translate }}
        </h3>
      </div>

      <app-loot-list
        [items]="generatedLoot()"
        [showPrices]="showPriceDetails()"
        [showFullBreakdown]="true"
        [isLoading]="false"
        [isMobile]="isMobile()"
        [isDesktop]="isDesktop()"
        class="loot-results"
      >
      </app-loot-list>
    </section>

    <!-- Empty State (when no loot and no error) -->
    <section
      class="empty-state grid-results"
      *ngIf="generatedLoot().length === 0 && !currentError()"
    >
      <div class="empty-content">
        <div class="empty-icon">⚔️</div>
        <h3 class="empty-title">{{ "loot.empty.title" | translate }}</h3>
        <p class="empty-description">
          {{ "loot.empty.description" | translate }}
        </p>
      </div>
    </section>
  </div>

  <!-- Error Display (outside responsive container as it spans full width) -->
  <div class="error-section" *ngIf="currentError()">
    <app-error-message
      [error]="currentError()"
      [allowDismiss]="true"
      [allowRetry]="true"
      [inline]="false"
      (dismiss)="onErrorDismiss()"
      (retry)="onErrorRetry()"
    >
    </app-error-message>
  </div>
</div>
