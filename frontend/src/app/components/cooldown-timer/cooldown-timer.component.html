<div
  class="cooldown-timer"
  [class.compact]="compact"
  [class.active]="isActive()"
  [ngClass]="'status-' + statusClass()"
>
  <!-- Full display mode -->
  <mat-card *ngIf="!compact && isActive()" class="cooldown-card">
    <mat-card-header>
      <mat-icon
        *ngIf="showIcon"
        mat-card-avatar
        class="status-icon"
        [ngClass]="'icon-' + statusClass()"
      >
        {{ statusIcon() }}
      </mat-icon>
      <mat-card-title>
        {{ "cooldown.title" | translate }}
      </mat-card-title>
      <mat-card-subtitle>
        {{ "cooldown.subtitle" | translate }}
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div class="time-display">
        <span class="time-value" [ngClass]="'time-' + statusClass()">
          {{ displayText() }}
        </span>
      </div>

      <mat-progress-bar
        *ngIf="showProgress"
        mode="determinate"
        [value]="progressPercentage()"
        class="progress-bar"
        [ngClass]="'progress-' + statusClass()"
      >
      </mat-progress-bar>
    </mat-card-content>
  </mat-card>

  <!-- Compact display mode -->
  <div *ngIf="compact && isActive()" class="cooldown-compact">
    <mat-icon
      *ngIf="showIcon"
      class="compact-icon"
      [ngClass]="'icon-' + statusClass()"
    >
      {{ statusIcon() }}
    </mat-icon>

    <span class="compact-text" [ngClass]="'text-' + statusClass()">
      {{ displayText() }}
    </span>

    <div
      *ngIf="showProgress"
      class="compact-progress"
      [ngClass]="'progress-' + statusClass()"
    >
      <div
        class="compact-progress-bar"
        [style.width.%]="progressPercentage()"
      ></div>
    </div>
  </div>

  <!-- Ready state (both modes) -->
  <div *ngIf="!isActive()" class="cooldown-ready" [class.compact]="compact">
    <mat-icon *ngIf="showIcon" class="ready-icon"> check_circle </mat-icon>
    <span class="ready-text">
      {{ "cooldown.ready" | translate }}
    </span>
  </div>
</div>
