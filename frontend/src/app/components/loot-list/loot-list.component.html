<div class="loot-list-container">
  <!-- Header with item count -->
  <div class="list-header" *ngIf="hasItems() && !isLoading">
    <h3 class="list-title">
      {{ "loot.list.title" | translate }} ({{ itemCount() }})
    </h3>
  </div>

  <!-- Loading State -->
  <div class="empty-state" *ngIf="isLoading">
    <mat-progress-bar
      mode="indeterminate"
      class="loading-bar"
    ></mat-progress-bar>
    <p class="empty-state-message">{{ getEmptyStateMessage() | translate }}</p>
  </div>

  <!-- Empty State (no items) -->
  <div class="empty-state" *ngIf="!isLoading && !hasItems()">
    <p class="empty-state-message">{{ getEmptyStateMessage() | translate }}</p>
    <p class="empty-state-hint">{{ "loot.list.emptyHint" | translate }}</p>
  </div>

  <!-- Loot Items List - Custom Cards -->
  <div class="loot-items-list" *ngIf="hasItems() && !isLoading">
    <div
      *ngFor="let item of items; trackBy: trackByIndex"
      class="loot-item-card"
    >
      <div class="item-name">
        {{ item.name }}
      </div>
      <div class="item-description">
        {{ item.description }}
      </div>
      <div class="item-value" *ngIf="showPrices">
        {{ "item.value" | translate }}: {{ formatPrice(item) }}
      </div>
    </div>
  </div>
</div>
