<div class="generate-button-container">
  <button
    mat-raised-button
    color="primary"
    class="generate-button"
    [disabled]="isButtonDisabled()"
    (click)="onGenerateClick()"
    [attr.aria-label]="buttonText()"
  >
    <mat-icon class="button-icon" [class.spinning]="isLoading">
      {{ buttonIcon() }}
    </mat-icon>

    <span class="button-text">{{ buttonText() }}</span>

    <!-- Loading spinner overlay -->
    <mat-spinner *ngIf="isLoading" diameter="16" class="button-spinner">
    </mat-spinner>
  </button>

  <!-- Cooldown progress indicator -->
  <div
    *ngIf="cooldownRemaining > 0"
    class="cooldown-progress"
    [attr.aria-label]="'common.cooldown.remaining' | translate"
  >
    <div
      class="progress-bar"
      [style.width.%]="(cooldownRemaining / 30000) * 100"
    ></div>
  </div>
</div>
